        content: A machine learning project using the 2023 national Youth Risk Behavior Survey (YRBSS) dataset to explore risk factors, apply data cleaning and modeling techniques, and generate policy-relevant insights for adolescent health. Includes preprocessing, model fitting, visualizations, and a full report.
        image: /images/projects/YRBS-2023-A_16-9_1920x1080.jpg
        featured:
          name: GitHub Repo
          link: https://github.com/NoccioNoir/YRBS_suicide_predictions
        badges:
