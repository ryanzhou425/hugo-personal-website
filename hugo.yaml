  # About
  about:
    enable: true
    title: "About Me"
    content: |-
      I am a passionate and creative marketing strategist with extensive experience in branding, strategic marketing, and consulting. My background in stage hosting has helped me develop strong communication skills, adaptability, and quick thinking. Having spent over seven years in the U.S., I am fluent in both English and Chinese.

      I hold a Bachelor’s degree in Marketing from the University of Pittsburgh, where I focused on branding and strategic marketing. Early in my career, I gained hands-on experience in advertising design at a jewelry store in Los Angeles and honed my skills in marketing research and analysis. After returning to China, I worked as a Marketing Manager at Baidu, where I specialized in market strategy and consumer insights. I then transitioned to strategic marketing consulting at Dentsu, further deepening my expertise in brand strategy and business consulting.

      Currently, I am pursuing a Master’s degree in Data Science at Northwestern University, where I am exploring the intersection of AI and strategic consulting. I am passionate about marketing consulting and brand strategy, and I aspire to transition into management consulting. At the same time, I have a strong entrepreneurial spirit and am eager to explore innovative business opportunities in the future.

      Beyond work and studies, I enjoy reading, engaging in artistic activities, and playing sports. As a certified National Second-Level Athlete, I have a strong competitive spirit and a love for teamwork. I embrace challenges with enthusiasm and approach every opportunity with curiosity and determination.

      As a lifelong learner and dream chaser, I am constantly seeking new knowledge, pushing boundaries, and striving to create meaningful impact in everything I do.
    skills:
      enable: true
      title: "Here are a few skills I've been working with recently:"
      items:
        - "Python"
        - "R"
        - "Go"
        - "SQL"
        - "Hadoop"
        - "Tableau"

  # Experience
  experience:
    enable: true
    index: true
    # title: "Custom Name"
    items:
      - job: "Founder"
        company: "Senthrall"
        date: "March 2023 - Present"
        content: "Launched an independent beauty brand and conducted comprehensive category analysis to establish competitive product portfolio and pricing strategy; collaborate closely with suppliers to perform rigorous sample testing; develop original creative assets for various marketing and brand experience touchpoints"

      - job: "Strategic Marketing Consultant"
        company: "Dentsu"
        date: "Aug 2018 - July 2021"
        content: |
          -	Designed and executed strategic marketing plans encompassing branding, research, and digital ecosystem planning for brands in FMCG, hospitality, apparel, electronics, pharmaceuticals, and energy industries
          -	Oversaw the execution of marketing campaigns, synthesizing findings and insights to provide clients with valuable implications and assessments on effective market strategies
          -	Conducted comprehensive market analysis by leveraging surveys, interviews, and data visualization to extract actionable insights, driving supported decision-making and informing client marketing roadmaps
          - Delivered compelling presentations on marketing strategies and recommendations for client actions
          -	Managed multiple concurrent projects and timelines, ensuring efficient and timely completion of deliverables
          -	Involved in global strategic planning to foster consistent communication and alignment across markets 
          -	Participated in pitches and assisted the team to secure new business

      - job: "Marketing Manager"
        company: "Baidu"
        date: "Sept 2015 - June 2018"    
        content: |
          -	Communicated with clients to understand their long-term business objectives, current business scenarios, marketing pain points, and the corresponding data support needed
          -	Utilized Baidu Big Data and Baidu Analytical Tools to segment customers, interpret behavioral statistics, forecast market trends, analyze competitive landscape, and inform solid marketing plans
          -	Conducted marketing research and stay updated with industry trends to identify digital opportunities for clients
          -	Delivered presentations and workshops to clients on digital strategies, tools, and implementation best practices
     



